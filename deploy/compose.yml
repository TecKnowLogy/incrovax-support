services:
  control:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    network_mode: host
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Technikerpasswort in deploy/.env setzen}
      PUBLIC_URL: http://127.0.0.1:8787
      PORT: 8787
      DATA_DIR: /app/data
    volumes:
      - control-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  control-data:
