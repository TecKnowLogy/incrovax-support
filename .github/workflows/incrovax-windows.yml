name: INCrovax Windows x64 Testbuild
env:
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  MAC_RUST_VERSION: '1.81'
  CARGO_NDK_VERSION: 3.1.2
  SCITER_ARMV7_CMAKE_VERSION: 3.29.7
  SCITER_NASM_DEBVERSION: 2.15.05-1
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  ANDROID_FLUTTER_VERSION: 3.24.5
  FLUTTER_WINDOWS_ARM_VERSION: 3.44.9
  FLUTTER_ELINUX_VERSION: 3.16.9
  TAG_NAME: incrovax-test
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_CMAKE_VERSION: 4.3.0
  ARMV7_VCPKG_COMMIT_ID: 6f29f12e82a8293156836ad81cc9bf5af41fe836
  VERSION: 1.5.0
  NDK_VERSION: r28c
  ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
  MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: '-2'
jobs:
  generate-bridge:
    uses: ./.github/workflows/incrovax-bridge.yml
  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: windows-2022
          platform: x64
    with:
      upload-artifact: true
      target: ${{ matrix.job.target }}
      configuration: Release
      platform: ${{ matrix.job.platform }}
      target_version: Windows10
  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs:
    - build-RustDeskTempTopMostWindow
    - generate-bridge
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-pc-windows-msvc
          os: windows-2022
          arch: x86_64
          flutter-arch: x64
          vcpkg-triplet: x64-windows-static
          build-args: --vram
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL
          || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN
          || '''');

          '
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' ||
          'bridge-artifact' }}
        path: ./
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
      with:
        version: ${{ env.LLVM_VERSION }}
    - name: Install flutter
      id: flutter
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        channel: stable
        flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION
          || env.FLUTTER_VERSION }}
        architecture: x64
    - name: Force arm64 Dart SDK + engine
      if: ${{ matrix.job.arch == 'aarch64' }}
      run: "$flutterRoot = \"${{ steps.flutter.outputs['CACHE-PATH'] }}\"\nWrite-Host\
        \ \"PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE\"\nWrite-Host \"Flutter\
        \ root: $flutterRoot\"\nRemove-Item -Force \"$flutterRoot\\bin\\cache\\engine-dart-sdk.stamp\"\
        \ -ErrorAction SilentlyContinue\n& \"$flutterRoot\\bin\\internal\\update_dart_sdk.ps1\"\
        \n# Confirm the Dart we ended up with is arm64 (\"on windows_arm64\"); fail\
        \ loudly if not.\n$dartVer = & \"$flutterRoot\\bin\\dart.bat\" --version 2>&1\
        \ | Out-String\nWrite-Host $dartVer\nif ($dartVer -notmatch \"windows_arm64\"\
        ) {\n  Write-Error \"Expected an arm64 Dart SDK but got: $dartVer\"\n  exit\
        \ 1\n}\n& \"$flutterRoot\\bin\\flutter.bat\" precache --windows\n# Fail fast\
        \ if precache pulled the wrong-arch Windows engine: an arm64 Dart should\n\
        # fetch windows-arm64 engine artifacts. Bailing here saves the ~25min Rust\
        \ build.\n$engineDir = \"$flutterRoot\\bin\\cache\\artifacts\\engine\"\nWrite-Host\
        \ \"Engine artifacts present:\"\nGet-ChildItem $engineDir -Directory | Select-Object\
        \ -ExpandProperty Name | Write-Host\nif (-not (Test-Path \"$engineDir\\windows-arm64-release\"\
        )) {\n  Write-Error \"Expected windows-arm64-release engine artifacts but\
        \ they are missing (wrong-arch SDK).\"\n  exit 1\n}\n"
    - name: Replace engine with rustdesk custom flutter engine
      if: ${{ matrix.job.arch == 'x86_64' }}
      run: 'flutter doctor -v

        flutter precache --windows

        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip
        -OutFile windows-x64-release.zip

        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release

        mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{
        env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

        '
    - name: Patch flutter
      if: ${{ matrix.job.arch == 'x86_64' }}
      shell: bash
      run: "cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname\
        \ $(dirname $(which flutter)))\ncd $(dirname $(dirname $(which flutter)))\n\
        if [[ \"3.24.5\" == ${{env.FLUTTER_VERSION}} ]]; then\n  git apply flutter_3.24.4_dropdown_menu_enableFilter.diff\n\
        fi\n"
    - name: Patch RustDesk sources for Flutter 3.44 (arm64)
      if: ${{ matrix.job.arch == 'aarch64' }}
      shell: bash
      run: bash .github/patches/apply_flutter_3.44_source_patches.sh
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.SCITER_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: ${{ matrix.job.os }}
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
      run: "if ! $VCPKG_ROOT/vcpkg \\\n  install \\\n  --triplet ${{ matrix.job.vcpkg-triplet\
        \ }} \\\n  --x-install-root=\"$VCPKG_ROOT/installed\"; then\n  find \"${VCPKG_ROOT}/\"\
        \ -name \"*.log\" | while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\
        \n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\n\
        fi\nhead -n 100 \"${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet\
        \ }}-rel-out.log\" || true\n"
      shell: bash
    - name: Set SODIUM_LIB_DIR (arm64)
      if: ${{ matrix.job.arch == 'aarch64' }}
      shell: bash
      run: echo "SODIUM_LIB_DIR=$VCPKG_ROOT/installed/${{ matrix.job.vcpkg-triplet
        }}/lib" >> "$GITHUB_ENV"
    - name: Build rustdesk
      run: "# Windows: build RustDesk\n# --hwcodec is shared by all Windows targets;\
        \ per-target extras (e.g. --vram) come from the matrix\npython3 .\\build.py\
        \ --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args\
        \ }}\nmv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release\
        \ ./rustdesk\n\n# Download usbmmidd_v2.zip and extract it to ./rustdesk\n\
        Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip\
        \ -OutFile usbmmidd_v2.zip\nExpand-Archive usbmmidd_v2.zip -DestinationPath\
        \ .\nRemove-Item -Path usbmmidd_v2\\Win32 -Recurse\nRemove-Item -Path \"usbmmidd_v2\\\
        deviceinstaller64.exe\", \"usbmmidd_v2\\deviceinstaller.exe\", \"usbmmidd_v2\\\
        usbmmidd.bat\"\nmv -Force .\\usbmmidd_v2 ./rustdesk\n\n# Download printer\
        \ driver files and extract them to ./rustdesk\ntry {\n  Invoke-WebRequest\
        \ -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip\
        \ -OutFile rustdesk_printer_driver_v4-1.4.zip\n  Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip\
        \ -OutFile printer_driver_adapter.zip\n  Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums\
        \ -OutFile sha256sums\n\n  # Check and move the files\n  $checksum_driver\
        \ = (Select-String -Path .\\sha256sums -Pattern '^([a-fA-F0-9]{64}) \\*rustdesk_printer_driver_v4-1.4\\\
        .zip$').Matches.Groups[1].Value\n  $downloadsum_driver = Get-FileHash -Path\
        \ rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256\n  $checksum_adapter\
        \ = (Select-String -Path .\\sha256sums -Pattern '^([a-fA-F0-9]{64}) \\*printer_driver_adapter\\\
        .zip$').Matches.Groups[1].Value\n  $downloadsum_adapter = Get-FileHash -Path\
        \ printer_driver_adapter.zip -Algorithm SHA256\n  if ($checksum_driver -eq\
        \ $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash)\
        \ {\n      Write-Output \"rustdesk_printer_driver_v4-1.4, checksums match,\
        \ extract the file.\"\n      Expand-Archive rustdesk_printer_driver_v4-1.4.zip\
        \ -DestinationPath .\n      mkdir ./rustdesk/drivers\n      mv -Force .\\\
        rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver\n\
        \      Expand-Archive printer_driver_adapter.zip -DestinationPath .\n    \
        \  mv -Force .\\printer_driver_adapter.dll ./rustdesk\n  } elseif ($checksum_driver\
        \ -ne $downloadsum_driver.Hash) {\n      Write-Output \"rustdesk_printer_driver_v4-1.4,\
        \ checksums do not match, ignore the file.\"\n  } else {\n      Write-Output\
        \ \"printer_driver_adapter.dll, checksums do not match, ignore the file.\"\
        \n  }\n} catch {\n    Write-Host \"Ingore the printer driver error.\"\n}\n"
    - name: find Runner.res
      continue-on-error: true
      shell: bash
      run: "runner_res=$(find . -name \"Runner.res\");\nif [ \"$runner_res\" == \"\
        \" ]; then\n  echo \"Runner.res: not found\";\nelse\n  echo \"Runner.res:\
        \ $runner_res\";\n  cp $runner_res ./libs/portable/Runner.res;\n  echo \"\
        list ./libs/portable/Runner.res\";\n  ls -l ./libs/portable/Runner.res;\n\
        fi\n"
    - name: Download RustDeskTempTopMostWindow artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      if: ${{ true }}
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64'
          || 'topmostwindow-artifacts-x64' }}
        path: ./rustdesk
    - name: Upload unsigned
      if: env.UPLOAD_ARTIFACT == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-unsigned-windows-${{ matrix.job.arch }}
        path: rustdesk
    - name: Name installed client executable
      shell: pwsh
      run: Move-Item ./rustdesk/rustdesk.exe ./rustdesk/INCrovax-Support.exe
    - name: Build self-extracted executable
      shell: bash
      if: env.UPLOAD_ARTIFACT == 'true'
      run: 'sed -i ''/dpiAware/d'' res/manifest.xml

        pushd ./libs/portable

        pip3 install -r requirements.txt

        python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/INCrovax-Support.exe

        popd

        mkdir -p ./SignOutput

        mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{
        env.VERSION }}-${{ matrix.job.arch }}.exe

        '
    - name: Verify portable output
      shell: pwsh
      run: if (-not (Test-Path ./SignOutput/*.exe)) { throw "Portable build produced
        no EXE" }
    - name: Upload INCrovax portable executable
      shell: pwsh
      run: '$exe = Get-ChildItem ./SignOutput/*.exe | Select-Object -First 1

        if (-not $exe) { throw "Portable EXE missing" }

        Copy-Item $exe.FullName ./SignOutput/INCrovax-Support.exe'
    - name: Test first-launch installation and automatic service
      shell: pwsh
      timeout-minutes: 4
      run: "$ErrorActionPreference = 'Stop'\n$exe = Join-Path $env:ProgramFiles 'INCrovax-Support/INCrovax-Support.exe'\n\
        Start-Process ./SignOutput/INCrovax-Support.exe\n$deadline = (Get-Date).AddSeconds(90)\n\
        do {\n  Start-Sleep -Seconds 2\n  $svc = Get-Service -Name 'INCrovax-Support'\
        \ -ErrorAction SilentlyContinue\n} until (((Test-Path $exe) -and $svc.Status\
        \ -eq 'Running') -or (Get-Date) -gt $deadline)\nif (-not (Test-Path $exe))\
        \ { throw 'First launch did not install the client' }\n$svc = Get-CimInstance\
        \ Win32_Service -Filter \"Name='INCrovax-Support'\"\nif ($svc.State -ne 'Running'\
        \ -or $svc.StartMode -ne 'Auto') { throw 'Automatic service missing or stopped'\
        \ }\nWrite-Host \"Installation verified: $exe; service running, start mode\
        \ Auto\"\n& $exe --option approve-mode password | Out-String\nStart-Sleep\
        \ -Seconds 3\nRestart-Service -Name 'INCrovax-Support'\nStart-Sleep -Seconds\
        \ 5\n$mode = & $exe --option approve-mode | Out-String\nif ($mode.Trim() -ne\
        \ 'password') { throw \"Approval selection did not persist: $mode\" }\nWrite-Host\
        \ 'Password approval mode persists across service restart; no access password\
        \ was embedded.'\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: INCrovax-Support-Windows-x64-unsigned
        path: SignOutput/INCrovax-Support.exe
        if-no-files-found: error
    timeout-minutes: 120
'on':
  push:
    branches:
    - incrovax-support
    paths:
    - .github/workflows/incrovax-windows.yml
    - src/incrovax.rs
    - src/core_main.rs
    - src/lib.rs
    - flutter/assets/**
    - flutter/windows/runner/**
    - res/icon.ico
  workflow_dispatch: {}
permissions:
  contents: read
