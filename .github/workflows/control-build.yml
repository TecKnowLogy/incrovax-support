name: INCrovax Control · Tests und Windows
on:
  push:
    branches: [incrovax-control]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/control.test.mjs
  windows:
    needs: server-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build own Windows QuickSupport
        run: dotnet publish windows/INCrovax.QuickSupport.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/QuickSupport
      - name: Verify Windows application startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process ./artifacts/QuickSupport/INCrovax-QuickSupport.exe -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw "QuickSupport closed unexpectedly: $($p.ExitCode)" }
          if ($p.MainWindowTitle -notlike '*INCrovax QuickSupport*') { throw "Expected visible QuickSupport window: $($p.MainWindowTitle)" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: INCrovax-Control-QuickSupport-Windows-x64
          path: artifacts/QuickSupport/INCrovax-QuickSupport.exe
          if-no-files-found: error
      - name: Package server source
        shell: pwsh
        run: Compress-Archive -Path server,deploy,package.json,README.md,LICENSE -DestinationPath artifacts/INCrovax-Control-Server.zip
      - uses: actions/upload-artifact@v4
        with:
          name: INCrovax-Control-Server
          path: artifacts/INCrovax-Control-Server.zip
